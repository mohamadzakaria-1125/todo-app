<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>My Tasks</h1>
        <p class="subtitle">Plan your day and get things done.</p>
      </header>

      <form id="task-form" class="task-form">
        <input
          id="task-input"
          class="task-input"
          type="text"
          placeholder="What do you need to do?"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message">No tasks yet.</p>

      <footer class="app-footer">Built while learning Git &amp; GitHub</footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
